<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina nu există · Polistibrick</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #F7F4ED; color: #0F0F0F;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .cutie { text-align: center; max-width: 560px; }
    .logo { height: 40px; margin-bottom: 40px; }
    .cod {
      font-size: clamp(80px, 18vw, 140px); font-weight: 700; line-height: 1;
      letter-spacing: -0.05em; color: #E23E44; margin-bottom: 16px;
    }
    h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 600; letter-spacing: -0.02em; margin-bottom: 12px; }
    p { font-size: 16px; color: #6b6b6b; line-height: 1.6; margin-bottom: 32px; }
    .butoane { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 14px 28px; border-radius: 8px;
      font-size: 15px; font-weight: 600; text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-rosu { background: #E23E44; color: #fff; box-shadow: 0 4px 14px rgba(226,62,68,0.30); }
    .btn-alb { background: #fff; color: #0F0F0F; border: 1px solid #e2ddd2; }
  </style>
</head>
<body>
  <div class="cutie">
    <img class="logo" src="/images/logo.png" alt="Polistibrick">
    <div class="cod">404</div>
    <h1>Pagina asta nu există.</h1>
    <p>Adresa e greșită sau pagina a fost mutată. Casa există. Pagina nu.</p>
    <div class="butoane">
      <a class="btn btn-rosu" href="/">Prima pagină</a>
      <a class="btn btn-alb" href="/preturi/">Prețuri</a>
      <a class="btn btn-alb" href="/contact/">Contact</a>
    </div>
  </div>
</body>
</html>
