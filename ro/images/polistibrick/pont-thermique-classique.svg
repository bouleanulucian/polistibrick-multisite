<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coupe mur maçonnerie classique : la dalle chaude traverse l'isolant et rejoint le bloc froid — la chaleur sort par la façade.">
<defs>
  <pattern id="aChaud" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#f7cfd0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e0787d" stroke-width="1.05"/>
  </pattern>
  <pattern id="aBloc" width="28" height="17" patternUnits="userSpaceOnUse">
    <rect width="28" height="17" fill="#dedad2"/>
    <rect x="2.5" y="3" width="9.5" height="11" fill="#f4f2ee" stroke="#b4aea4" stroke-width="1"/>
    <rect x="15" y="3" width="9.5" height="11" fill="#f4f2ee" stroke="#b4aea4" stroke-width="1"/>
  </pattern>
  <pattern id="aLaine" width="13" height="11" patternUnits="userSpaceOnUse">
    <rect width="13" height="11" fill="#f7efe7"/>
    <path d="M0 5.5 q3.25 -4.5 6.5 0 t6.5 0" fill="none" stroke="#e0cfbc" stroke-width="1.1"/>
  </pattern>
  <filter id="aHot" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="aHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#e23e44"/>
  </marker>
  <style>
    .aS{font:400 12px 'Inter',system-ui,sans-serif;fill:#6f6a62}
    .aL{font:500 11.5px 'Inter',system-ui,sans-serif;fill:#3d3931;paint-order:stroke;stroke:#f7f5f1;stroke-width:3.4px;stroke-linejoin:round}
    .aR{font:600 11.5px 'Inter',system-ui,sans-serif;fill:#b3282e;paint-order:stroke;stroke:#f7f5f1;stroke-width:3.4px;stroke-linejoin:round}
    .aD{font:400 10.5px 'Inter',system-ui,sans-serif;fill:#918b81}
    .aSide{font:600 10px 'Inter',system-ui,sans-serif;fill:#a09a90;letter-spacing:.1em}
    .aBad{font:700 14px 'Inter',system-ui,sans-serif;fill:#e23e44}
    .aLn{stroke:#b0aaa0;stroke-width:.9;fill:none}
    .aEd{stroke:#5c574e;stroke-width:1.15;fill:none}
  </style>
</defs>
<rect width="640" height="480" fill="#f7f5f1"/>

<g><rect x="40" y="34" width="8" height="126" fill="#c8c3ba"/><rect x="48" y="34" width="110" height="126" fill="url(#aBloc)"/>
   <rect x="158" y="34" width="55" height="126" fill="url(#aLaine)"/><rect x="213" y="34" width="7" height="126" fill="#efece7"/></g>
<g><rect x="40" y="270" width="8" height="102" fill="#c8c3ba"/><rect x="48" y="270" width="110" height="102" fill="url(#aBloc)"/>
   <rect x="158" y="270" width="55" height="102" fill="url(#aLaine)"/><rect x="213" y="270" width="7" height="102" fill="#efece7"/></g>

<rect x="48" y="160" width="337" height="110" fill="url(#aChaud)"/>
<rect x="40" y="160" width="8" height="110" fill="#e8b5b6"/>
<g filter="url(#aHot)" opacity=".85"><rect x="40" y="160" width="180" height="110" fill="#e23e44" opacity=".22"/></g>

<g stroke="#e23e44" stroke-width="2.7" fill="none" stroke-linecap="round" marker-end="url(#aHead)">
  <path d="M134 187 q-30 -9 -58 0 t-64 0"/><path d="M134 215 q-30 -9 -58 0 t-64 0"/><path d="M134 243 q-30 -9 -58 0 t-64 0"/>
</g>

<g class="aEd"><rect x="40" y="34" width="180" height="126"/><rect x="40" y="270" width="180" height="102"/>
  <rect x="40" y="160" width="8" height="110"/><rect x="48" y="160" width="337" height="110"/>
  <line x1="48" y1="34" x2="48" y2="160"/><line x1="158" y1="34" x2="158" y2="160"/><line x1="213" y1="34" x2="213" y2="160"/>
  <line x1="48" y1="270" x2="48" y2="372"/><line x1="158" y1="270" x2="158" y2="372"/><line x1="213" y1="270" x2="213" y2="372"/></g>

<g class="aLn"><path d="M103 72 L396 72"/><path d="M185 110 L396 110"/></g>
<text x="400" y="76" class="aL">bloc béton 20 cm <tspan class="aD">— hors isolant</tspan></text>
<text x="400" y="114" class="aL">isolant intérieur <tspan class="aD">— coupé par la dalle</tspan></text>
<text x="240" y="220" class="aR">dalle béton — chaude</text>

<text x="40" y="394" class="aSide">← EXTÉRIEUR</text>
<text x="600" y="394" class="aSide" text-anchor="end">INTÉRIEUR →</text>
<text x="40" y="430" class="aBad">La chaleur sort</text>
<text x="40" y="452" class="aS">le béton chaud rejoint le mur froid : rien ne l’arrête avant la façade.</text>
<g transform="translate(524,470)">
  <line x1="0" y1="0" x2="55" y2="0" stroke="#5c574e" stroke-width="1.5"/>
  <line x1="0" y1="-4" x2="0" y2="4" stroke="#5c574e" stroke-width="1.5"/>
  <line x1="55" y1="-4" x2="55" y2="4" stroke="#5c574e" stroke-width="1.5"/>
  <text x="62" y="4" class="aD">10 cm</text>
</g>
            </svg>
