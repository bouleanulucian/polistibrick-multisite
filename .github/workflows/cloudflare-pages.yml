name: Deploy Cloudflare Pages

on:
  push:
    branches: [main, master]
    paths:
      - "countries/**"
      - "shared/**"
      - "build/**"
      - "translations/**"
      - "cloudflare/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:
    inputs:
      country:
        description: "Country code (fr, ro, en, …)"
        required: true
        default: "fr"

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # La push se publică DOAR România (decizie 11.08.2026 — restul ţărilor se
        # lansează manual, una câte una, prin workflow_dispatch, când sunt gata).
        country: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.country)) || fromJSON('["ro"]') }}
    env:
      COUNTRY: ${{ matrix.country }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Istoricul complet e necesar pentru <lastmod> din sitemap: build-ul ia
          # data fiecărei pagini din `git log`. Cu clona implicită (un singur
          # commit) toate paginile ies „modificate azi" — exact semnalul fals pe
          # care lastmod ar trebui să-l evite. `filter: blob:none` aduce doar
          # istoricul modificărilor, nu şi fişierele vechi; altfel s-ar căra
          # 766 MB de video la fiecare publicare.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Creare zona polistibrick.fr (temporar, o folosință)
        # Formularul de onboarding din dashboard pică («Error checking domains»);
        # zona se creează prin API. Idempotent: dacă există deja, doar raportează.
        if: env.COUNTRY == 'fr'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X POST https://api.cloudflare.com/client/v4/zones             -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json"             --data "{\"name\":\"polistibrick.fr\",\"account\":{\"id\":\"$CF_ACC\"},\"type\":\"full\"}"           | python3 -c 'import json,sys; d=json.load(sys.stdin); print("success:", d["success"]); print("errors:", d["errors"]); r=d.get("result") or {}; print("zone_id:", r.get("id")); print("nameservers:", r.get("name_servers"))'

      - name: Build site
        run: python3 build/build.py "$COUNTRY"

      - name: Read Cloudflare project
        id: cfg
        run: |
          python3 <<'PY'
          import json, os, sys
          code = os.environ["COUNTRY"]
          cfg = json.load(open("cloudflare/projects.json"))[code]
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"project={cfg['project']}\n")
              f.write(f"domain={cfg['domain']}\n")
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Prima lansare a unei țări: proiectul poate lipsi din cont. Crearea e
          # idempotentă — dacă există, comanda pică și deploy-ul merge mai departe.
          preCommands: wrangler pages project create ${{ steps.cfg.outputs.project }} --production-branch=main || true
          command: pages deploy build/${{ env.COUNTRY }} --project-name=${{ steps.cfg.outputs.project }} --branch=main
