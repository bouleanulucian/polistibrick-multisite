# O SINGURĂ folosință: creează zona polistibrick.fr în contul Cloudflare,
# fiindcă formularul din dashboard s-a blocat la onboarding (eroare «checking domains»).
# Nu atinge nimic altceva; se șterge după migrare.
name: Creare zona polistibrick.fr
on: workflow_dispatch
jobs:
  zona:
    runs-on: ubuntu-latest
    steps:
      - name: POST /zones
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X POST https://api.cloudflare.com/client/v4/zones \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data "{\"name\":\"polistibrick.fr\",\"account\":{\"id\":\"$CF_ACC\"},\"type\":\"full\"}" \
          | python3 -c 'import json,sys; d=json.load(sys.stdin); print("success:", d["success"]); print("errors:", d["errors"]); r=d.get("result") or {}; print("zone_id:", r.get("id")); print("nameservers:", r.get("name_servers"))'
