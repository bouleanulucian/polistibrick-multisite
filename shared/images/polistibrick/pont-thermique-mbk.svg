<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coupe mur Polistibrick MBK au droit d'un plancher : le PSE extérieur passe devant le plancher sans coupure, la chaleur reste dedans. Mur et plancher sont coulés d'un seul tenant ; la seule reprise de bétonnage se trouve au-dessus du plancher.">
  <defs>
    <pattern id="bChaud" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f7cfd0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e0787d" stroke-width="1.05"/>
    </pattern>
    <pattern id="bEps" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#f4efd9"/><circle cx="7.5" cy="7.5" r="5.4" fill="none" stroke="#ded5ad" stroke-width="1.1"/>
    </pattern>
    <filter id="bCool" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .bS{font:400 12px 'Inter',system-ui,sans-serif;fill:#6f6a62}
      .bL{font:500 11.5px 'Inter',system-ui,sans-serif;fill:#3d3931;paint-order:stroke;stroke:#f7f5f1;stroke-width:3.4px;stroke-linejoin:round}
      .bR{font:600 11.5px 'Inter',system-ui,sans-serif;fill:#b3282e;paint-order:stroke;stroke:#f7f5f1;stroke-width:3.4px;stroke-linejoin:round}
      .bG{font:600 11.5px 'Inter',system-ui,sans-serif;fill:#15682f;paint-order:stroke;stroke:#f7f5f1;stroke-width:3.4px;stroke-linejoin:round}
      .bD{font:400 10.5px 'Inter',system-ui,sans-serif;fill:#918b81}
      .bSide{font:600 10px 'Inter',system-ui,sans-serif;fill:#a09a90;letter-spacing:.1em}
      .bGood{font:700 14px 'Inter',system-ui,sans-serif;fill:#1a7d3a}
      .bLn{stroke:#b0aaa0;stroke-width:.9;fill:none}
      .bEd{stroke:#5c574e;stroke-width:1.15;fill:none}
    </style>
  </defs>
  <rect width="640" height="480" fill="#f7f5f1"/>

  <!-- enveloppe extérieure : fibrociment + PSE, continus sur toute la hauteur -->
  <rect x="40" y="34" width="4"  height="338" fill="#a8a49c"/>
  <rect x="44" y="34" width="77" height="338" fill="url(#bEps)"/>

  <!-- béton : le mur et le plancher ne font qu'un -->
  <rect x="121" y="34" width="82" height="338" fill="url(#bChaud)"/>
  <rect x="121" y="160" width="264" height="110" fill="url(#bChaud)"/>

  <!-- panneaux intérieurs, arrêtés par le plancher -->
  <g><rect x="203" y="34" width="39" height="126" fill="url(#bEps)"/><rect x="242" y="34" width="7" height="126" fill="#a8a49c"/></g>
  <g><rect x="203" y="270" width="39" height="102" fill="url(#bEps)"/><rect x="242" y="270" width="7" height="102" fill="#a8a49c"/></g>

  <!-- barrière verte, jamais interrompue -->
  <g filter="url(#bCool)" opacity=".9"><rect x="44" y="34" width="77" height="338" fill="#1a7d3a" opacity=".16"/></g>
  <rect x="44" y="34" width="77" height="338" fill="none" stroke="#1a7d3a" stroke-width="2.6"/>

  <!-- la chaleur bute sur l'isolant -->
  <g stroke="#1a7d3a" fill="none" stroke-linecap="round">
    <g stroke-width="2.7"><path d="M188 187 q-28 -8 -56 0"/><path d="M188 215 q-28 -8 -56 0"/><path d="M188 243 q-28 -8 -56 0"/></g>
    <g stroke-width="3.8"><path d="M127 179 L127 195"/><path d="M127 207 L127 223"/><path d="M127 235 L127 251"/></g>
  </g>

  <g class="bEd">
    <rect x="40" y="34" width="4" height="338"/>
    <path d="M121 34 H203 V160 H385 V270 H203 V372 H121 Z"/>
    <path d="M203 34 H249 V160"/><line x1="242" y1="34" x2="242" y2="160"/>
    <path d="M203 372 H249 V270"/><line x1="242" y1="270" x2="242" y2="372"/>
  </g>
  <!-- reprise de bétonnage : au-dessus du plancher, là où repart le mur -->
  <line x1="40" y1="160" x2="203" y2="160" stroke="#5c574e" stroke-width="1.15" stroke-dasharray="5 3"/>

  <g class="bLn"><path d="M82 66 L396 66"/><path d="M162 104 L396 104"/><path d="M222 142 L396 142"/></g>
  <text x="400" y="70" class="bG">PSE 14 cm <tspan class="bD" fill="#918b81">— jamais coupé</tspan></text>
  <text x="400" y="108" class="bR">béton armé 15 cm <tspan class="bD" fill="#918b81">— chaud</tspan></text>
  <text x="400" y="146" class="bL">PSE 7 cm</text>
  <text x="248" y="220" class="bR">plancher PBK — coulé avec le mur</text>

  <text x="40" y="394" class="bSide">← EXTÉRIEUR</text>
  <text x="600" y="394" class="bSide" text-anchor="end">INTÉRIEUR →</text>
  <text x="40" y="430" class="bGood">La chaleur reste dedans</text>
  <text x="40" y="452" class="bS">le PSE extérieur passe devant le plancher : aucune coupure.</text>
  <g transform="translate(524,470)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#5c574e" stroke-width="1.5"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#5c574e" stroke-width="1.5"/>
    <line x1="55" y1="-4" x2="55" y2="4" stroke="#5c574e" stroke-width="1.5"/>
    <text x="62" y="4" class="bD">10 cm</text>
  </g>
</svg>
