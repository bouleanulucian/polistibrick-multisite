<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coupe mur Polistiwall au droit d'un plancher : le PSE extérieur passe devant le plancher sans coupure, la chaleur reste dedans. Face intérieure en béton brut, sans panneau. Mur et plancher sont coulés d'un seul tenant ; la seule reprise de bétonnage se trouve au-dessus du plancher.">
  <defs>
    <pattern id="wChaud" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f7cfd0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e0787d" stroke-width="1.05"/>
    </pattern>
    <pattern id="wEps" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#f4efd9"/><circle cx="7.5" cy="7.5" r="5.4" fill="none" stroke="#ded5ad" stroke-width="1.1"/>
    </pattern>
    <filter id="wCool" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .wS{font:400 12px 'Inter',system-ui,sans-serif;fill:#6f6a62}
      .wL{font:500 11.5px 'Inter',system-ui,sans-serif;fill:#3d3931;paint-order:stroke;stroke:#f7f5f1;stroke-width:3.4px;stroke-linejoin:round}
      .wR{font:600 11.5px 'Inter',system-ui,sans-serif;fill:#b3282e;paint-order:stroke;stroke:#f7f5f1;stroke-width:3.4px;stroke-linejoin:round}
      .wG{font:600 11.5px 'Inter',system-ui,sans-serif;fill:#15682f;paint-order:stroke;stroke:#f7f5f1;stroke-width:3.4px;stroke-linejoin:round}
      .wD{font:400 10.5px 'Inter',system-ui,sans-serif;fill:#918b81}
      .wSide{font:600 10px 'Inter',system-ui,sans-serif;fill:#a09a90;letter-spacing:.1em}
      .wGood{font:700 14px 'Inter',system-ui,sans-serif;fill:#1a7d3a}
      .wLn{stroke:#b0aaa0;stroke-width:.9;fill:none}
      .wEd{stroke:#5c574e;stroke-width:1.15;fill:none}
    </style>
  </defs>
  <rect width="640" height="480" fill="#f7f5f1"/>

  <!-- PSE extérieur 20 cm : continu sur toute la hauteur -->
  <rect x="40" y="34" width="110" height="338" fill="url(#wEps)"/>

  <!-- béton : le mur et le plancher ne font qu'un -->
  <rect x="150" y="34" width="82" height="338" fill="url(#wChaud)"/>
  <rect x="150" y="160" width="235" height="110" fill="url(#wChaud)"/>

  <!-- barrière verte, jamais interrompue -->
  <g filter="url(#wCool)" opacity=".9"><rect x="40" y="34" width="110" height="338" fill="#1a7d3a" opacity=".16"/></g>
  <rect x="40" y="34" width="110" height="338" fill="none" stroke="#1a7d3a" stroke-width="2.6"/>

  <!-- la chaleur bute sur l'isolant -->
  <g stroke="#1a7d3a" fill="none" stroke-linecap="round">
    <g stroke-width="2.7"><path d="M217 187 q-28 -8 -56 0"/><path d="M217 215 q-28 -8 -56 0"/><path d="M217 243 q-28 -8 -56 0"/></g>
    <g stroke-width="3.8"><path d="M156 179 L156 195"/><path d="M156 207 L156 223"/><path d="M156 235 L156 251"/></g>
  </g>

  <!-- contour du béton : un seul corps, mur + plancher -->
  <path class="wEd" d="M150 34 H232 V160 H385 V270 H232 V372 H150 Z"/>
  <!-- reprise de bétonnage : au-dessus du plancher, là où repart le mur -->
  <line x1="40" y1="160" x2="232" y2="160" stroke="#5c574e" stroke-width="1.15" stroke-dasharray="5 3"/>
  <!-- face intérieure : béton brut, arête franche -->
  <g stroke="#5c574e" stroke-width="2.2" fill="none">
    <line x1="232" y1="34" x2="232" y2="160"/><line x1="232" y1="270" x2="232" y2="372"/>
  </g>

  <g class="wLn"><path d="M95 66 L396 66"/><path d="M191 104 L396 104"/><path d="M232 142 L396 142"/></g>
  <text x="400" y="70" class="wG">PSE 20 cm <tspan class="wD" fill="#918b81">— jamais coupé</tspan></text>
  <text x="400" y="108" class="wR">béton armé 15 cm <tspan class="wD" fill="#918b81">— chaud</tspan></text>
  <text x="400" y="146" class="wL">face intérieure béton <tspan class="wD">— sans panneau</tspan></text>
  <text x="248" y="220" class="wR">plancher PBK — coulé avec le mur</text>

  <text x="40" y="394" class="wSide">← EXTÉRIEUR</text>
  <text x="600" y="394" class="wSide" text-anchor="end">INTÉRIEUR →</text>
  <text x="40" y="430" class="wGood">La chaleur reste dedans</text>
  <text x="40" y="452" class="wS">le PSE extérieur passe devant le plancher : aucune coupure.</text>
  <g transform="translate(524,470)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#5c574e" stroke-width="1.5"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#5c574e" stroke-width="1.5"/>
    <line x1="55" y1="-4" x2="55" y2="4" stroke="#5c574e" stroke-width="1.5"/>
    <text x="62" y="4" class="wD">10 cm</text>
  </g>
</svg>
