<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} · Articole Polistibrick</title>
  <meta name="description" content="{{META_DESC}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/site.css">
  <style>
    .wm-section { padding: clamp(48px, 6vw, 80px) 0; background: var(--cream); }
    .wm-stage-wrap { position: relative; margin: 50px auto 0; max-width: 980px; }
    .wm-watermark { position: absolute; top: 0; left: 50%; width: 100vw; margin-left: -50vw; pointer-events: none; user-select: none; transform: translateY(-50%); height: 1em; line-height: 1; text-align: center; text-transform: uppercase; font-family: var(--serif); font-size: clamp(48px, 10vw, 140px); font-weight: 500; letter-spacing: -0.06em; z-index: 2; }
    .wm-watermark .wm-half { position: absolute; inset: 0; width: 100%; display: block; }
    .wm-watermark .wm-top { color: transparent; -webkit-text-stroke: 1.4px rgba(15,15,15,0.30); clip-path: inset(0 0 50% 0); }
    .wm-watermark .wm-bottom { color: var(--cream-dark); opacity: 0.65; clip-path: inset(50% 0 0 0); }
    .wm-stage { position: relative; background: var(--cream-light); border: 1px solid var(--border); border-radius: 28px; padding: 40px 44px; }
    .art-meta { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 16px; font-size: 13px; color: var(--gray); }
    .art-meta a { color: var(--red); font-weight: 600; text-decoration: none; }
    .art-meta a:hover { text-decoration: underline; }
    .wm-text h1 { font-family: var(--serif); font-size: clamp(28px, 3.6vw, 44px); font-weight: 500; color: var(--ink); letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 14px; }
    .wm-text h1 em { font-style: italic; color: var(--red); font-weight: 400; }
    .wm-text .lead { font-size: 16px; color: var(--gray); line-height: 1.65; max-width: 640px; }
    .art-hero-img { margin-top: 28px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); aspect-ratio: 16/9; }
    .art-hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .art-body { max-width: 720px; margin: 0 auto; }
    .art-body h2 { font-family: var(--serif); font-size: clamp(22px, 2.4vw, 28px); font-weight: 500; margin: 36px 0 14px; color: var(--ink); }
    .art-body h3 { font-size: 17px; font-weight: 700; margin: 28px 0 10px; color: var(--ink); }
    .art-body p { font-size: 15.5px; line-height: 1.72; color: var(--ink-soft); margin-bottom: 16px; }
    .art-body ul, .art-body ol { margin: 0 0 18px 1.2em; font-size: 15px; line-height: 1.65; color: var(--ink-soft); }
    .art-body li { margin-bottom: 8px; }
    .art-body strong { color: var(--ink); }
    @media (max-width: 768px) { .wm-stage { padding: 28px 22px; } }
  </style>
</head>
<body data-base="../../../">

<header class="nav" data-include="nav"></header>

<section class="wm-section">
  <div class="container">
    <div class="wm-stage-wrap reveal">
      <div class="wm-watermark" aria-hidden="true">
        <span class="wm-half wm-top">{{WATERMARK}}</span>
        <span class="wm-half wm-bottom">{{WATERMARK}}</span>
      </div>
      <div class="wm-stage">
        <div class="wm-text">
          <div class="art-meta">
<span>{{DATE}}</span>
            <span>{{READ_MIN}} min citire</span>
            <a href="../">← Toate articolele</a>
          </div>
          <h1>{{HEADLINE}}</h1>
          <p class="lead">{{LEAD}}</p>
          <div class="art-hero-img">
            <img src="{{HERO_IMAGE}}" alt="{{HERO_ALT}}">
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section section--cream">
  <div class="container">
    <div class="art-body reveal">
{{CONTENT_HTML}}
    </div>
  </div>
</section>

<section class="section section--tight">
  <div class="container">
    <div class="cta-band reveal">
      <h2>Vrei o estimare pentru <em>proiectul tău?</em></h2>
      <p>Configurator AI gratuit — ofertă estimativă în câteva minute, PDF pe email.</p>
      <div class="cta-band-actions">
        <a href="../../../oferta/" class="btn btn-on-dark btn-large btn-arrow">Cere o ofertă →</a>
        <a href="../../../calculator/" class="btn btn-on-dark-ghost btn-large">Calculator cost</a>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer" data-include="footer"></footer>
<script src="../../../assets/js/site.js" defer></script>
</body>
</html>
